name: Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libboost-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libgif-dev \
            libglu1-mesa-dev \
            libharfbuzz-dev \
            libmpg123-dev \
            libopencv-dev \
            libopus-dev \
            libopusfile-dev \
            libsoundtouch-dev \
            libswresample-dev \
            libtiff-dev \
            libturbojpeg0-dev \
            libvorbis-dev \
            libwebp-dev \
            libxft-dev \
            uuid-dev \
            xorg-dev \
            xvfb

      - name: Cache OpenSiv3D install
        id: siv3d-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.siv3d-install
          key: opensiv3d-0.6.16-gcc13-sse42-${{ runner.os }}-v1

      # OpenSiv3D v0.6.16, GCC (not Clang), -msse4.2 so Platform.hpp takes the real SSE path.
      - name: Build and install OpenSiv3D
        if: steps.siv3d-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.6.16 https://github.com/Siv3D/OpenSiv3D.git "$RUNNER_TEMP/OpenSiv3D"
          cmake -S "$RUNNER_TEMP/OpenSiv3D/Linux" -B "$RUNNER_TEMP/OpenSiv3D/Linux/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS=-msse4.2 \
            -DCMAKE_CXX_FLAGS=-msse4.2 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.siv3d-install"
          cmake --build "$RUNNER_TEMP/OpenSiv3D/Linux/build"
          cmake --install "$RUNNER_TEMP/OpenSiv3D/Linux/build"
          cp -a "$RUNNER_TEMP/OpenSiv3D/Linux/App/resources" "$GITHUB_WORKSPACE/.siv3d-install/resources"

      - name: Build NavalWar
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.siv3d-install"
          cmake --build build

      - name: Smoke run
        run: |
          ln -sfn "$GITHUB_WORKSPACE/.siv3d-install/resources" build/resources
          set +e
          xvfb-run -a timeout 8 ./build/NavalWar
          code=$?
          set -e
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            exit "$code"
          fi
